version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR per ecosystem cluster rather than one per package.
      radix:
        patterns: ["@radix-ui/*"]
      types:
        patterns: ["@types/*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
