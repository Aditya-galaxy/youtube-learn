name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel a superseded run when new commits land on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` runs the postinstall hook, which generates the Prisma client.
      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # No secrets needed: the build reads no database and treats missing auth
      # variables as a startup warning rather than a fatal error.
      - name: Build
        run: npm run build
